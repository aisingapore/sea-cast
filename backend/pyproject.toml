[project]
name = "sea-cast-backend"
version = "0.1.0"
description = "SEA-CAST backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "openai>=2.48.0",
    "pipecat-ai[elevenlabs,openai,silero,rnnoise]>=1.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "seagull",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
# This is an application, not a distributable library — don't build/install the
# project itself into the environment.
package = false

[tool.uv.sources]
seagull = { git = "https://github.com/aisingapore/seagull.git", rev = "v0.1.0" }